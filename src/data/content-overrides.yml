# Per-article editorial metadata without bulk-editing hundreds of MD files.
# Keys (first match wins): stable articleId (fd-en-000001), locale:slug, slug, or path
#
# hubId / relatedArticleIds: prefer stable IDs; slug fallback supported during migration
#
# Priority: frontmatter explicit value > this file > derived defaults
#
# Example:
# phone-free-focus-guide:
#   articleType: guide
#   cluster: focus-management
#   hubId: phone-free-focus-guide
#   isHub: true
#   consolidationStatus: keep
#   relatedArticleIds:
#     - recover-focus-after-burnout-guide
