# Optional: copy exported registry into focus-blog so the site mirror stays current
# without opening raw URLs on a private repo.
#
# Secrets (at_her_cafe repo):
#   FOCUS_BLOG_PAT — PAT with repo scope on kafkatanaka/focus-blog

name: Push registry to focus-blog

on:
  push:
    paths:
      - 'public/cobw-registry.json'
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push cobw-registry.json to focus-blog
        env:
          PAT: ${{ secrets.FOCUS_BLOG_PAT }}
        run: |
          set -euo pipefail
          CONTENT=$(base64 -w0 public/cobw-registry.json)
          SHA=$(curl -sS -H "Authorization: Bearer $PAT" \
            "https://api.github.com/repos/kafkatanaka/focus-blog/contents/public/cobw-registry.json" \
            | jq -r '.sha // empty')
          BODY=$(jq -n \
            --arg msg "chore: mirror COBW registry from at_her_cafe" \
            --arg content "$CONTENT" \
            --arg branch "main" \
            --arg sha "$SHA" \
            '{message:$msg,content:$content,branch:$branch} + (if $sha != "" then {sha:$sha} else {} end)')
          curl -sS -X PUT -H "Authorization: Bearer $PAT" -H "Accept: application/vnd.github+json" \
            -d "$BODY" \
            "https://api.github.com/repos/kafkatanaka/focus-blog/contents/public/cobw-registry.json"
